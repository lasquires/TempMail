<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>tempMail</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>tempMail</h1>
      <div class="address-bar">
        <span id="address">Creating inbox…</span>
        <button id="copyBtn" type="button" disabled>Copy</button>
      </div>
      <button id="refreshBtn" type="button" disabled>Refresh</button>
      <button id="newBtn" type="button">New address</button>
    </header>

    <main>
      <aside>
        <div class="pane-title">
          <strong>Inbox</strong>
          <span id="count"></span>
        </div>
        <div id="messageList" class="message-list">
          <div class="empty">Waiting for messages…</div>
        </div>
      </aside>

      <section class="reader">
        <div id="readerEmpty" class="reader-empty">
          <span>✉</span>
          <p>Select a message</p>
        </div>
        <div id="readerContent" class="reader-content hidden">
          <div class="reader-header">
            <h2 id="subject"></h2>
            <div id="meta"></div>
            <div id="attachments" class="attachments hidden"></div>
          </div>
          <iframe id="emailFrame" title="Email message" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
        </div>
      </section>
    </main>

    <footer id="status">Starting…</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
